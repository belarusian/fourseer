name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff mypy
      - name: Test
        run: pytest tests/ -x -q
      - name: Lint
        run: ruff check fourseer/
      - name: Type check
        run: mypy fourseer/ --ignore-missing-imports
